<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSR Pro | Training Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    /* THEMING SYSTEM 
       Default is now "Dark" to prevent eye strain immediately.
    */
    :root {
        --primary: #6366f1;
        --bg: #f8fafc;
        --sidebar-bg: #ffffff;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --border: #e2e8f0;
        
        --chat-bg: #f1f5f9;
        --bubble-customer: #ffffff;
        --text-customer: #1e293b;
        --bubble-user: #6366f1;
        --text-user: #ffffff;
        
        --success: #10b981;
        --danger: #ef4444;
        --warning: #f59e0b;
        --feedback-bg: #fff7ed;
        --feedback-border: #fed7aa;
        --feedback-text: #9a3412;
    }

    [data-theme="dark"] {
        --primary: #818cf8;
        --bg: #0f172a;        /* Deep Blue/Grey - Easy on eyes */
        --sidebar-bg: #1e293b;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --border: #334155;
        
        --chat-bg: #0f172a;
        --bubble-customer: #334155;
        --text-customer: #f1f5f9;
        --bubble-user: #4f46e5;
        --text-user: #ffffff;

        --feedback-bg: #332d20; /* Darker amber for dark mode */
        --feedback-border: #78350f;
        --feedback-text: #fdba74;
    }

    * { box-sizing: border-box; }
    body { 
        margin: 0; font-family: 'Inter', sans-serif; 
        background: var(--bg); color: var(--text-main); 
        height: 100vh; display: flex; flex-direction: column; 
        transition: background 0.3s, color 0.3s;
    }

    /* HEADER */
    header {
        background: var(--sidebar-bg); border-bottom: 1px solid var(--border); 
        padding: 0 1.5rem; height: 60px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand { font-weight: 700; font-size: 1.1rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
    
    /* Theme Toggle Switch */
    .theme-toggle {
        background: none; border: 1px solid var(--border); color: var(--text-muted);
        padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
        display: flex; align-items: center; gap: 6px; width: auto;
    }
    .theme-toggle:hover { background: var(--border); }

    /* LAYOUT */
    #layout {
        display: grid; grid-template-columns: 320px 1fr; 
        height: calc(100vh - 60px); overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar {
        background: var(--sidebar-bg); border-right: 1px solid var(--border); 
        padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; 
        overflow-y: auto;
    }
    .card { 
        background: var(--bg); border: 1px solid var(--border); 
        border-radius: 8px; padding: 1rem; 
    }
    .card h3 { margin: 0 0 0.8rem 0; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em; }

    select, button.action-btn { 
        width: 100%; padding: 10px; border-radius: 6px; 
        border: 1px solid var(--border); background: var(--sidebar-bg); color: var(--text-main);
        font-family: inherit; margin-bottom: 8px;
    }
    button.primary-btn {
        width: 100%; padding: 10px; border-radius: 6px; border: none;
        background: var(--primary); color: #fff; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* STATS & TAGS */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box { background: var(--sidebar-bg); padding: 8px; border-radius: 6px; text-align: center; border: 1px solid var(--border); }
    .stat-val { font-weight: 700; font-size: 1.1rem; display: block; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); }
    
    .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); }
    .tag.missing { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.2); }
    .tag.used { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.2); }

    /* CHAT AREA */
    #chat-container {
        display: flex; flex-direction: column; height: 100%; position: relative; background: var(--chat-bg);
    }
    #scenario-header {
        background: var(--sidebar-bg); padding: 10px 20px; border-bottom: 1px solid var(--border);
        display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted);
    }
    
    /* SCROLLABLE CHAT FEED */
    #chat-feed {
        flex: 1; padding: 1.5rem; overflow-y: auto; 
        display: flex; flex-direction: column; gap: 1rem;
        scroll-behavior: smooth; /* Smooth scrolling */
    }

    /* BUBBLES */
    .msg-row { display: flex; width: 100%; }
    .msg-row.customer { justify-content: flex-start; }
    .msg-row.user { justify-content: flex-end; }
    
    .bubble {
        max-width: 75%; padding: 12px 16px; border-radius: 12px; 
        line-height: 1.5; font-size: 0.95rem; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .customer .bubble { background: var(--bubble-customer); color: var(--text-customer); border-bottom-left-radius: 2px; }
    .user .bubble { background: var(--bubble-user); color: var(--text-user); border-bottom-right-radius: 2px; }

    /* FEEDBACK BLOCK (SYSTEM) */
    .feedback-block {
        background: var(--feedback-bg); border: 1px solid var(--feedback-border); 
        color: var(--feedback-text); border-radius: 8px; padding: 1rem;
        margin: 5px auto; max-width: 85%; font-size: 0.9rem;
    }
    .highlight { background: rgba(255, 255, 0, 0.3); font-weight: 700; padding: 0 2px; border-radius: 2px; }

    /* INPUT AREA */
    #input-area {
        background: var(--sidebar-bg); padding: 1rem; border-top: 1px solid var(--border);
        display: flex; gap: 10px; align-items: flex-end;
    }
    textarea {
        flex: 1; border: 1px solid var(--border); background: var(--bg); color: var(--text-main);
        border-radius: 8px; padding: 12px; font-size: 1rem; resize: none; outline: none;
    }
    textarea:focus { border-color: var(--primary); }

    /* RESPONSIVE */
    @media(max-width: 768px){
        #layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        #sidebar { height: auto; max-height: 25vh; border-bottom: 1px solid var(--border); border-right: none; }
    }
</style>
</head>
<body>

<header>
    <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        CSR Trainer
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
        <span id="theme-icon">☀️</span> <span id="theme-text">Light Mode</span>
    </button>
</header>

<div id="layout">
    <div id="sidebar">
        <div class="card">
            <h3>Controls</h3>
            <select id="industry">
                <option value="" disabled selected>Select Industry</option>
                {% for i in industries %}
                <option value="{{ i }}">{{ i }}</option>
                {% endfor %}
            </select>
            <button class="primary-btn" onclick="startPractice()">Start Session</button>
            <p id="warning-box" style="color:var(--danger); font-size:0.8rem; text-align:center; margin-top:5px; min-height:1em;"></p>
        </div>

        <div class="card" id="report-card" style="opacity:0.5; pointer-events:none;">
            <h3>Live Analysis</h3>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-label">WPM</span><span class="stat-val" id="stat-wpm">-</span></div>
                <div class="stat-box"><span class="stat-label">Tone</span><span class="stat-val" id="stat-tone">-</span></div>
            </div>
            <div style="margin-top:12px">
                <h4 style="font-size:0.75rem; color:var(--text-muted); margin-bottom:5px">Missing Keywords:</h4>
                <div id="missing-keywords" class="tags"></div>
            </div>
        </div>
    </div>

    <div id="chat-container">
        <div id="scenario-header">
            <span id="scenarioType">Select industry to begin</span>
            <span id="timer">00:00</span>
        </div>

        <div id="chat-feed">
            <div style="text-align:center; margin-top:20vh; color:var(--text-muted);">
                <p>Ready to practice?</p>
            </div>
        </div>

        <div id="input-area">
            <textarea id="answer" rows="1" placeholder="Type your response here..." disabled></textarea>
            <button id="sendBtn" class="primary-btn" style="width:auto;" onclick="sendAnswer()" disabled>Send</button>
        </div>
    </div>
</div>

<script>
// --- Theme Logic ---
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute("data-theme");
    const icon = document.getElementById("theme-icon");
    const text = document.getElementById("theme-text");
    
    if (current === "dark") {
        html.setAttribute("data-theme", "light");
        icon.innerText = "🌙";
        text.innerText = "Dark Mode";
    } else {
        html.setAttribute("data-theme", "dark");
        icon.innerText = "☀️";
        text.innerText = "Light Mode";
    }
}

// --- App Logic ---
let scenarios=[], index=0, startTime, timerInt;
const politeWords=["sorry","apologize","please","thank","understand","assist","help","kindly"];
const rudeWords=["stupid","useless","idiot","shut","angry","fraud"];

function normalize(t){ return t.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(w=>w.length>=3); }

function toneScore(text){
    let w=normalize(text);
    if(w.some(x=>rudeWords.includes(x))) return `<span style="color:var(--danger)">Rude</span>`;
    if(w.filter(x=>politeWords.includes(x)).length>=2) return `<span style="color:var(--success)">Polite</span>`;
    return `<span style="color:var(--warning)">Neutral</span>`;
}

function startPractice(){
    const ind = document.getElementById("industry").value;
    if(!ind) return alert("Select an industry!");
    
    document.getElementById("warning-box").innerText = "Loading...";
    
    fetch("/start",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({industry: ind})
    })
    .then(r=>r.json()).then(d=>{
        if(d.error) return alert(d.error);
        
        scenarios=d; index=0;
        document.getElementById("chat-feed").innerHTML="";
        document.getElementById("report-card").style.opacity="1";
        document.getElementById("warning-box").innerText = "";
        
        enableInput();
        showCustomer();
    });
}

function showCustomer(){
    let s = scenarios[index];
    document.getElementById("scenarioType").innerText = `Scenario ${index+1}/${scenarios.length}: ${s.scenario_type}`;
    
    // Simulate delay
    setTimeout(() => {
        addBubble(s.customer, "customer");
        startTimer();
    }, 600);
}

function startTimer(){
    let t=0; startTime=Date.now();
    clearInterval(timerInt);
    document.getElementById("timer").innerText = "00:00";
    timerInt=setInterval(()=>{
        t++;
        let m=Math.floor(t/60), s=t%60;
        document.getElementById("timer").innerText = `${m}:${s<10?'0':''}${s}`;
    },1000);
}

function sendAnswer(){
    let txt = document.getElementById("answer").value.trim();
    if(!txt) return;
    clearInterval(timerInt);

    let wpm = Math.round((normalize(txt).length / ((Date.now()-startTime)/1000)) * 60);
    let tone = toneScore(txt);

    addBubble(txt, "user");

    // Analysis
    let ideal = scenarios[index].ideal;
    let missing = normalize(ideal).filter(x=>!normalize(txt).includes(x));

    document.getElementById("stat-wpm").innerText = wpm;
    document.getElementById("stat-tone").innerHTML = tone;
    document.getElementById("missing-keywords").innerHTML = missing.length 
        ? missing.map(k=>`<span class="tag missing">${k}</span>`).join("") 
        : `<span class="tag used">Perfect!</span>`;

    // Add Feedback Bubble
    addFeedbackBlock(ideal, txt);

    document.getElementById("answer").value="";
    index++;

    if(index < scenarios.length){
        setTimeout(showCustomer, 1500);
    } else {
        setTimeout(() => {
            addBubble("Session Completed! Please select a new industry.", "customer");
            disableInput();
        }, 1000);
    }
}

function addBubble(text, type){
    const chat = document.getElementById("chat-feed");
    const div = document.createElement("div");
    div.className = `msg-row ${type}`;
    div.innerHTML = `<div class="bubble">${text}</div>`;
    chat.appendChild(div);
    scrollToBottom();
}

function addFeedbackBlock(ideal, user){
    const chat = document.getElementById("chat-feed");
    const div = document.createElement("div");
    div.className = "feedback-block";
    
    let highlighted = ideal.split(" ").map(w => {
        let clean = w.toLowerCase().replace(/[^a-z]/g,"");
        let match = normalize(user).some(u => clean.startsWith(u));
        return match ? `<span class="highlight">${w}</span>` : w;
    }).join(" ");

    div.innerHTML = `<strong>Suggested Answer:</strong><br>${highlighted}`;
    chat.appendChild(div);
    scrollToBottom();
}

function scrollToBottom() {
    const chat = document.getElementById("chat-feed");
    // setTimeout ensures the DOM has rendered the new height before we scroll
    setTimeout(() => {
        chat.scrollTop = chat.scrollHeight;
    }, 50);
}

function enableInput(){ document.getElementById("answer").disabled=false; document.getElementById("sendBtn").disabled=false; document.getElementById("answer").focus(); }
function disableInput(){ document.getElementById("answer").disabled=true; document.getElementById("sendBtn").disabled=true; }

// Auto-expand textarea
const tx = document.getElementById("answer");
tx.addEventListener("input", function(){
    this.style.height = "auto";
    this.style.height = (this.scrollHeight) + "px";
});
tx.addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        sendAnswer();
    }
});
</script>

</body>
</html>
