<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSR Pro | Auto-Focus Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        /* LIGHT MODE (Default) */
        --bg-gradient: radial-gradient(circle at top left, #e0f2fe, #f0f9ff);
        --glass-bg: rgba(255, 255, 255, 0.65);
        --glass-border: rgba(255, 255, 255, 0.9);
        --glass-shadow: rgba(14, 165, 233, 0.1);
        
        --text-main: #0f172a;
        --text-muted: #64748b;
        --input-bg: rgba(255, 255, 255, 0.5);
        
        --primary-grad: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
        --primary-shadow: rgba(37, 99, 235, 0.2);
        
        --bubble-cust-bg: #ffffff;
        --bubble-cust-text: #334155;
        
        --feedback-bg: #fff7ed;
        --feedback-border: #fed7aa;
        --feedback-text: #c2410c;
        
        --option-bg: #ffffff;
    }

    [data-theme="dark"] {
        /* DARK MODE (Neutral Professional) */
        /* Changed from Neon Blue to Standard Dark Gray/Black */
        --bg-gradient: linear-gradient(135deg, #18181b 0%, #09090b 100%);
        --glass-bg: rgba(39, 39, 42, 0.8); /* Zinc 800 */
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-shadow: rgba(0, 0, 0, 0.8);
        
        --text-main: #f4f4f5; /* Zinc 100 */
        --text-muted: #a1a1aa; /* Zinc 400 */
        --input-bg: rgba(255, 255, 255, 0.05);
        
        /* Keep Primary Blue but less neon */
        --primary-grad: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        --primary-shadow: rgba(0, 0, 0, 0.4);
        
        --bubble-cust-bg: #27272a; /* Zinc 800 */
        --bubble-cust-text: #e4e4e7;
        
        --feedback-bg: rgba(67, 20, 7, 0.4);
        --feedback-border: rgba(249, 115, 22, 0.3);
        --feedback-text: #fdba74;

        --option-bg: #18181b; 
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Outfit', sans-serif;
        height: 100vh;
        overflow: hidden;
        color: var(--text-main);
        background: var(--bg-gradient);
        background-size: 200% 200%;
        transition: color 0.3s, background 0.3s;
    }

    /* BACKGROUND ORBS */
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); z-index: -1; opacity: 0.4; }
    .orb-1 { width: 500px; height: 500px; background: #0ea5e9; top: -150px; left: -150px; animation: float 15s infinite alternate; }
    .orb-2 { width: 400px; height: 400px; background: #6366f1; bottom: -100px; right: -100px; animation: float 12s infinite alternate-reverse; }
    @keyframes float { 0% { transform: translate(0,0); } 100% { transform: translate(40px, 40px); } }

    /* LAYOUT */
    #app-container {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 20px;
        height: 100vh;
        padding: 20px;
        max-width: 1920px;
        margin: 0 auto;
    }

    .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 var(--glass-shadow);
        border-radius: 20px;
        display: flex; flex-direction: column; overflow: hidden;
    }

    /* SIDEBAR */
    #sidebar { padding: 1.5rem; gap: 1.5rem; overflow-y: auto; }

    .brand { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .theme-toggle { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .theme-toggle:hover { background: rgba(255,255,255,0.1); }

    /* FORM ELEMENTS */
    label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 5px; display: block; }

    select {
        width: 100%; padding: 14px;
        background: var(--input-bg);
        border: 1px solid var(--glass-border);
        color: var(--text-main);
        border-radius: 12px;
        outline: none; cursor: pointer;
        font-family: inherit; font-size: 0.95rem; font-weight: 500;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat; background-position: right 1rem center; background-size: 1.2em;
    }
    
    select option {
        background-color: var(--option-bg);
        color: var(--text-main);
        padding: 10px;
    }

    button.primary-btn {
        width: 100%; padding: 16px; margin-top: 10px;
        border-radius: 12px; border: none;
        background: var(--primary-grad);
        color: white; font-weight: 600; font-size: 1rem;
        cursor: pointer;
        box-shadow: 0 4px 20px var(--primary-shadow);
        transition: transform 0.1s, box-shadow 0.2s;
    }
    button.primary-btn:active { transform: scale(0.98); }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box { background: var(--input-bg); border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; text-align: center; }
    .stat-val { font-size: 1.4rem; font-weight: 700; display: block; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--glass-border); }
    .tag.missing { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }
    .tag.used { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }

    /* CHAT AREA */
    #chat-container { position: relative; }
    #scenario-header {
        padding: 15px 25px; border-bottom: 1px solid var(--glass-border);
        display: flex; justify-content: space-between; align-items: center;
        background: rgba(0,0,0,0.05); font-weight: 500; font-size: 0.9rem;
    }

    #chat-feed {
        flex: 1; padding: 25px; overflow-y: auto;
        display: flex; flex-direction: column; gap: 1rem;
        min-height: 0; scroll-behavior: smooth;
    }

    /* BUBBLES */
    .msg-row { display: flex; width: 100%; opacity: 0; animation: fadeUp 0.3s forwards; }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(10px); } }
    .msg-row.customer { justify-content: flex-start; }
    .msg-row.user { justify-content: flex-end; }

    .bubble { max-width: 75%; padding: 14px 18px; border-radius: 18px; line-height: 1.55; position: relative; backdrop-filter: blur(5px); }
    .customer .bubble { background: var(--bubble-cust-bg); color: var(--bubble-cust-text); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
    .user .bubble { background: var(--primary-grad); color: white; box-shadow: 0 4px 15px var(--primary-shadow); border-bottom-right-radius: 4px; }

    /* FEEDBACK CARD */
    .feedback-block {
        align-self: center; width: 90%;
        background: var(--feedback-bg); border: 1px solid var(--feedback-border); border-left: 4px solid #f97316;
        border-radius: 8px; padding: 12px 16px; margin-bottom: 5px;
        color: var(--feedback-text); font-size: 0.9rem;
        animation: fadeUp 0.3s forwards;
    }
    .highlight { background: rgba(255, 230, 0, 0.3); padding: 0 3px; border-radius: 3px; font-weight: 700; color: inherit; }

    /* INPUT AREA */
    #input-area {
        padding: 20px; background: rgba(0,0,0,0.1); border-top: 1px solid var(--glass-border);
        display: flex; gap: 12px; align-items: stretch;
    }

    textarea {
        flex: 1; background: var(--input-bg); border: 1px solid var(--glass-border);
        border-radius: 12px; padding: 14px;
        color: var(--text-main); font-size: 1rem; font-family: inherit;
        resize: none; outline: none; transition: 0.2s;
    }
    textarea:focus { border-color: #38bdf8; background: rgba(0,0,0,0.25); }
    
    #sendBtn {
        width: auto; padding: 0 30px; margin: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }

    @media(max-width: 900px) {
        #app-container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 10px; }
        #sidebar { max-height: 250px; }
    }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div id="app-container">
    <div id="sidebar" class="glass-panel">
        <div class="brand">
            <span>CSR Pro</span>
            <button class="theme-toggle" onclick="toggleTheme()" title="Switch to Dark Mode">🌙</button>
        </div>

        <div>
            <label>Training Module</label>
            <select id="industry">
                <option value="" disabled selected>Select Industry...</option>
                {% for i in industries %}
                <option value="{{ i }}">{{ i }}</option>
                {% endfor %}
            </select>
            <button class="primary-btn" onclick="startPractice()">Start Session ↵</button>
            <p id="warning-box" style="color:#f87171; font-size:0.8rem; text-align:center; margin-top:10px; min-height:1.2em;"></p>
        </div>

        <div id="report-card" style="opacity:0.3; transition:opacity 0.5s;">
            <label>Live Metrics</label>
            <div class="stats-grid">
                <div class="stat-box"><span class="stat-val" id="stat-wpm">--</span><span class="stat-label">WPM</span></div>
                <div class="stat-box"><span class="stat-val" id="stat-tone">--</span><span class="stat-label">Tone</span></div>
            </div>
            <div style="margin-top:20px">
                <label>Keywords</label>
                <div id="missing-keywords" class="tags">
                    <span style="font-size:0.8rem; opacity:0.6;">--</span>
                </div>
            </div>
        </div>
    </div>

    <div id="chat-container" class="glass-panel">
        <div id="scenario-header">
            <span id="scenarioType">Select industry to begin...</span>
            <span id="timer" style="font-family: monospace; font-size: 1.2em;">00:00</span>
        </div>

        <div id="chat-feed">
            <div style="text-align:center; margin-top:30vh; opacity:0.5;">
                <p>Ready to practice? Select an industry.</p>
            </div>
        </div>

        <div id="input-area">
            <textarea id="answer" rows="1" placeholder="Type response here..." disabled></textarea>
            <button id="sendBtn" class="primary-btn" onclick="sendAnswer()" disabled>
                Send
            </button>
        </div>
    </div>
</div>

<script>
// --- THEME ---
function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector(".theme-toggle");
    const current = html.getAttribute("data-theme");
    
    // Logic reversed: We start in Light, so if no attribute, go Dark
    if (current === "dark") {
        html.removeAttribute("data-theme");
        btn.innerText = "🌙"; // Show Moon (Go Dark)
        btn.title = "Switch to Dark Mode";
    } else {
        html.setAttribute("data-theme", "dark");
        btn.innerText = "☀"; // Show Sun (Go Light)
        btn.title = "Switch to Light Mode";
    }
}

// --- LOGIC ---
let scenarios=[], index=0, startTime, timerInt;
const politeWords=["sorry","apologize","please","thank","understand","assist","help","kindly","appreciate"];
const rudeWords=["stupid","useless","idiot","shut","angry","fraud","scam"];

function normalize(t){ return t.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(w=>w.length>=3); }

function toneScore(text){
    let w=normalize(text);
    if(w.some(x=>rudeWords.includes(x))) return `<span style="color:#f87171">Negative</span>`;
    if(w.filter(x=>politeWords.includes(x)).length>=2) return `<span style="color:#4ade80">Polite</span>`;
    return `<span style="color:#fbbf24">Neutral</span>`;
}

function startPractice(){
    const ind = document.getElementById("industry").value;
    if(!ind) return;
    
    document.getElementById("warning-box").innerText = "Loading...";
    
    fetch("/start",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({industry: ind})
    })
    .then(r=>r.json()).then(d=>{
        if(d.error) return alert(d.error);
        
        scenarios=d; index=0;
        document.getElementById("chat-feed").innerHTML="";
        document.getElementById("report-card").style.opacity="1";
        document.getElementById("warning-box").innerText = "";
        
        enableInput();
        showCustomer();
    }).catch(e=> document.getElementById("warning-box").innerText = "Error connecting.");
}

function showCustomer(){
    let s = scenarios[index];
    document.getElementById("scenarioType").innerHTML = `<span style="color:var(--text-main); font-weight:700;">Scenario ${index+1}:</span> ${s.scenario_type}`;
    
    setTimeout(() => {
        addBubble(s.customer, "customer");
        startTimer();
    }, 500);
}

function startTimer(){
    let t=0; startTime=Date.now();
    clearInterval(timerInt);
    document.getElementById("timer").innerText = "00:00";
    timerInt=setInterval(()=>{
        t++;
        let m=Math.floor(t/60), s=t%60;
        document.getElementById("timer").innerText = `${m}:${s<10?'0':''}${s}`;
    },1000);
}

function sendAnswer(){
    let txt = document.getElementById("answer").value.trim();
    if(!txt) return;
    clearInterval(timerInt);

    let wpm = Math.round((normalize(txt).length / ((Date.now()-startTime)/1000)) * 60);
    let tone = toneScore(txt);
    let ideal = scenarios[index].ideal;
    let missing = normalize(ideal).filter(x=>!normalize(txt).includes(x));

    document.getElementById("stat-wpm").innerText = wpm;
    document.getElementById("stat-tone").innerHTML = tone;
    document.getElementById("missing-keywords").innerHTML = missing.length 
        ? missing.map(k=>`<span class="tag missing">${k}</span>`).join("") 
        : `<span class="tag used">✨ Perfect</span>`;

    addFeedbackBlock(ideal, txt);
    addBubble(txt, "user");

    document.getElementById("answer").value="";
    document.getElementById("answer").focus();
    
    index++;

    if(index < scenarios.length){
        setTimeout(showCustomer, 1500);
    } else {
        setTimeout(() => {
            addBubble("Session Complete.", "customer");
            disableInput();
        }, 1000);
    }
}

function addBubble(text, type){
    const chat = document.getElementById("chat-feed");
    const div = document.createElement("div");
    div.className = `msg-row ${type}`;
    div.innerHTML = `<div class="bubble">${text}</div>`;
    chat.appendChild(div);
    scrollToBottom();
}

function addFeedbackBlock(ideal, user){
    const chat = document.getElementById("chat-feed");
    const div = document.createElement("div");
    div.className = "feedback-block";
    let highlighted = ideal.split(" ").map(w => {
        let clean = w.toLowerCase().replace(/[^a-z]/g,"");
        let match = normalize(user).some(u => clean.startsWith(u));
        return match ? `<span class="highlight">${w}</span>` : w;
    }).join(" ");
    div.innerHTML = `<strong>Suggested:</strong> ${highlighted}`;
    chat.appendChild(div);
    scrollToBottom();
}

function scrollToBottom() {
    const chat = document.getElementById("chat-feed");
    setTimeout(() => {
        const last = chat.lastElementChild;
        if(last) last.scrollIntoView({ behavior: "smooth", block: "end" });
    }, 100);
}

function enableInput(){ 
    const tx = document.getElementById("answer");
    tx.disabled=false; 
    document.getElementById("sendBtn").disabled=false; 
    tx.focus(); 
}
function disableInput(){ 
    document.getElementById("answer").disabled=true; 
    document.getElementById("sendBtn").disabled=true; 
}

const tx = document.getElementById("answer");
tx.addEventListener("input", function(){
    this.style.height = "auto";
    this.style.height = (this.scrollHeight) + "px";
});
tx.addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        sendAnswer();
    }
});
</script>

</body>
</html>
